name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional additional image tag"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_BACKEND_URL=

      - name: Publish release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Container package

            `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`

            This image is self-contained and includes:
            - MySQL database
            - Schema bootstrap from `docker/mysql/init.sql` (applied only on first DB initialization)
            - Backend + frontend app
            - Bundled/minified backend runtime in the final image

            ## Run

            ```bash
            docker run -d \
              --name test-grid \
              -p 5000:5000 \
              -v test-grid-data:/var/lib/mysql \
              -e MYSQL_ROOT_PASSWORD=your-root-password \
              -e MYSQL_DATABASE=test_grid \
              -e MYSQL_USER=testgrid \
              -e MYSQL_PASSWORD=your-db-password \
              -e DB_USER=testgrid \
              -e DB_PASSWORD=your-db-password \
              -e DB_NAME=test_grid \
              -e JWT_SECRET=your-jwt-secret \
              ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            The container requires replacing placeholder secret values before startup.
            For production guidance, see `README.md`.
